# Alembic configuration for Kitchen Inventory Assistant

[alembic]
# Path to migration scripts
script_location = alembic

# Migration file naming template
file_template = %%(rev)s_%%(slug)s

# Timezone used in generated migration timestamps
timezone = Asia/Ho_Chi_Minh

# Maximum length of a migration slug
truncate_slug_length = 40

# Database URL (overridden by env.py from settings.ADMIN_DATABASE_URL)
sqlalchemy.url = postgresql+psycopg://postgres:postgres_password_123@localhost:5432/kitchen_inventory

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
