# Cấu hình Alembic cho dự án Trợ lý kho bếp

[alembic]
# Đường dẫn tới thư mục migration scripts
script_location = alembic

# Định dạng đặt tên file migration
file_template = %%(rev)s_%%(slug)s

# Cấu hình timezone
timezone = Asia/Ho_Chi_Minh

# Số ký tự tối đa của slug
truncate_slug_length = 40

# URL kết nối cơ sở dữ liệu (sẽ được override bởi env.py từ settings.ADMIN_DATABASE_URL)
sqlalchemy.url = postgresql+psycopg://postgres:postgres_password_123@localhost:5432/kitchen_inventory

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
