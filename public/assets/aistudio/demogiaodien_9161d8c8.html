<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trợ lý kho bếp – Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --page:#E6ECE6;--bg:#F4F7F2;--card:#FFFFFF;--ink:#1F2A22;--muted:#4B5A4F;--line:#DDE5DF;--chip:#E4EBE5;
  --accent:#C2410C;--on-accent:#FFFFFF;--accent-text:#B03A0A;
  --dark:#1F2A22;--on-dark:#FFFFFF;--on-dark-muted:#D5DED7;--amber:#F2B544;
  --ok-bg:#DCEFE2;--ok-fg:#1E5C38;--warn-bg:#FDEBC8;--warn-fg:#7A4A00;--bad-bg:#FBE3E0;--bad-fg:#9B2C20;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0C120E;--bg:#121A15;--card:#1B261F;--ink:#EAF1EC;--muted:#A9B8AE;--line:#2B3A31;--chip:#25332A;
    --accent:#F08A57;--on-accent:#2A1206;--accent-text:#F5A178;
    --dark:#26362C;--on-dark:#F2F7F3;--on-dark-muted:#BFCDC3;
    --ok-bg:#1F3A2A;--ok-fg:#9FD8B4;--warn-bg:#3F3014;--warn-fg:#F2C46B;--bad-bg:#45201C;--bad-fg:#F2A39B;
  }
}
:root[data-theme="dark"]{
  --page:#0C120E;--bg:#121A15;--card:#1B261F;--ink:#EAF1EC;--muted:#A9B8AE;--line:#2B3A31;--chip:#25332A;
  --accent:#F08A57;--on-accent:#2A1206;--accent-text:#F5A178;
  --dark:#26362C;--on-dark:#F2F7F3;--on-dark-muted:#BFCDC3;
  --ok-bg:#1F3A2A;--ok-fg:#9FD8B4;--warn-bg:#3F3014;--warn-fg:#F2C46B;--bad-bg:#45201C;--bad-fg:#F2A39B;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.stage{height:100%}
.ghost{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:600}
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
#dls{display:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px 20px;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.tbs{display:flex;gap:8px}
.tb{height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;position:relative}
.nbadge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.main{flex:1;overflow-y:auto;padding:0 20px 24px}
.fab-space{height:84px}
.hd{padding:12px 0 0}
.hdrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hd small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.hd h1{margin:0;font-size:26px;line-height:1.2;font-weight:700}
.hero{margin-top:14px;background:var(--dark);color:var(--on-dark);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero b{font-size:22px;line-height:1.2}
.hero span{font-size:13px;color:var(--on-dark-muted);line-height:1.45}
.btn{min-height:48px;border:none;border-radius:12px;font-weight:700;font-size:14px;padding:6px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.light{background:#FFFFFF;color:#1F2A22}
.btn.outline{background:var(--card);color:var(--accent-text);border:1px solid var(--accent-text)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{height:44px;padding:0 14px;border:1px solid var(--accent-text);border-radius:22px;background:var(--card);color:var(--accent-text);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;flex:none}
.chips{margin-top:12px;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-weight:500;font-size:13px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-top:12px;gap:2px}
.seg button{flex:1;min-height:40px;border:none;border-radius:10px;background:transparent;font-size:12px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row.dim{opacity:.62}
.row-top{display:flex;align-items:center;gap:10px}
.prow{width:100%;text-align:left;border:none;background:var(--card);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;color:inherit}
.av{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.grow{flex:1;min-width:0}
.nm{font-size:15px;font-weight:600;display:block}
.sub{font-size:12px;color:var(--muted);display:block;line-height:1.45}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;white-space:nowrap;flex:none}
.ok{background:var(--ok-bg);color:var(--ok-fg)}.warn{background:var(--warn-bg);color:var(--warn-fg)}.bad{background:var(--bad-bg);color:var(--bad-fg)}.neutral{background:var(--chip);color:var(--ink)}
.row-act{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.mini{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:12px;font-weight:600}
.mini.p{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.empty{margin-top:28px;text-align:center;color:var(--muted);line-height:1.5;padding:0 12px}
.fab{position:absolute;right:20px;bottom:96px;height:52px;padding:0 20px;border:none;border-radius:26px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:2}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 10px}
.nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;color:var(--muted);font-size:11px;font-weight:500}
.nav button.on{color:var(--accent-text);font-weight:700}
.card{margin-top:12px;background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:17px;line-height:1.25}
.h3{margin:18px 0 0;font-size:15px;font-weight:700}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.inp{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.cbx{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
.ibtn{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.fl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600;min-width:0}
.fl .inp{height:42px;padding:0 10px}
.f3{display:grid;grid-template-columns:1fr 84px 1.2fr;gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.warnbox{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.warnbox b{font-size:13px}
.okbox{background:var(--ok-bg);color:var(--ok-fg);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.okbox b{font-size:13px}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{min-height:48px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;font-size:13px}
.opt.on{border:2px solid var(--accent-text);color:var(--accent-text)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.ins{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.5}
.ins b{font-size:12px;color:var(--muted)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--chip)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metrics>div{background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.metrics span{font-size:11px;color:var(--muted)}
.metrics b{font-size:14px}
.metrics .inp{height:34px;padding:0 8px;font-weight:700}
.chat{display:flex;flex-direction:column;margin-top:6px}
.msg{max-width:90%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.5;margin-top:8px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.msg.ai{align-self:flex-start;background:var(--card)}
.unread::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-text);margin-right:6px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:12px 20px 22px}
.sheet h2{margin:0;font-size:19px;flex:1}
.sheet-hd{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.rcpt{position:relative;margin-top:12px;height:150px;border-radius:18px;background:#2A352D;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--amber);box-shadow:0 0 12px var(--amber);animation:sweep 1.4s linear infinite}
@keyframes sweep{from{top:0}to{top:100%}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}}
.toast{position:absolute;left:20px;right:20px;bottom:92px;background:var(--dark);color:var(--on-dark);padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;z-index:9;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.note{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Responsive ===== */
.metrics b{overflow-wrap:anywhere}
.sheet{overscroll-behavior:contain}
@media (max-width:899px){
 .inp{font-size:16px}
 .main{padding:0 max(20px,calc((100% - 720px)/2)) 24px}
 .fab{right:max(20px,calc((100% - 720px)/2 + 20px))}
}
@media (max-width:380px){
 .f3{grid-template-columns:1fr 1fr}
 .f3>label:first-child{grid-column:1/-1}
 .hd h1{font-size:22px}
}
@media (min-width:600px){
 .ov{align-items:center;justify-content:center}
 .sheet{width:min(640px,92%);max-height:90%;border-radius:24px;padding:16px 24px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
}
@media (min-width:900px){
 .phone{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "nav main"}
 .top{grid-area:top;padding:14px 32px 12px;background:var(--card);border-bottom:1px solid var(--line)}
 .brand{font-size:17px}
 .nav{grid-area:nav;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line)}
 .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 14px;border-radius:12px;font-size:14px}
 .nav button.on{background:var(--chip)}
 .main{grid-area:main;padding:0 max(32px,calc((100% - 960px)/2)) 40px}
 .hd h1{font-size:30px}
 .chips{flex-wrap:wrap}
 .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
 .sheet .list{grid-template-columns:1fr}
 .tb[data-act="openScan"]{display:none}
 .fab{right:32px;bottom:28px}
 .fab-space{height:64px}
 .toast{left:auto;right:32px;bottom:28px;max-width:380px}
 .btn:hover,.mini:hover,.chip:hover,.opt:hover,.prow:hover,.nav button:hover{filter:brightness(.96)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="top" id="top"></div>
    <div class="main" id="main"></div>
    <div class="nav" id="nav"></div>
    <div id="ov"></div>
    <div id="dls"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

 {n:'Bánh pancake sữa',price:40000,i:[['sữa tươi',0.2],['trứng gà',1],['bột mì',0.1]]},
 {n:'Rau muống xào tỏi',price:30000,i:[['rau muống',0.2],['tỏi',0.02]]},

];

var scan={tab:'in',phase:'idle',rows:[],file:''};

var tkP='month',tkDay=plus(0),tkMonth=plus(0).slice(0,7),tkQ=(function(){var d=new Date();return d.getFullYear()+'-'+(Math.floor(d.getMonth()/3)+1)})(),tkFrom=plus(-6),tkTo=plus(0);
var bellDate='all',bellPick='',bellOnly='all';
var chat=[{r:'ai',t:'Xin chào! Mình là trợ lí kho bếp. Bạn có thể hỏi về tồn kho, đồ cần xử lí, lãi lỗ hoặc món nên nấu.'}];

/* ===== Tiện ích ===== */
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function plus(n){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return iso(d)}
function daysLeft(o){var p=o.exp.split('-');var e=new Date(+p[0],+p[1]-1,+p[2]);var t=new Date();t.setHours(0,0,0,0);return Math.round((e-t)/86400000)}
function dmy(s){var p=s.split('-');return p[2]+'/'+p[1]}
function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function round2(n){return Math.round(n*100)/100}
function fmt(n){return String(round2(n)).replace('.',',')}
function money(n){var r=Math.round(n);return (r<0?'-':'')+Math.abs(r).toLocaleString('vi-VN')+' đ'}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?NaN:n}
function num0(v){var n=num(v);return isNaN(n)?0:n}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function cat(n){return P[n]||(S&&S.custom&&S.custom[n])||null}
function U(n){var c=cat(n);return (S&&S.units&&S.units[n])||(c?c.u:'phần')}
function usual(n){var c=cat(n);return c&&c.us?c.us:null}
function qs(n,q){return fmt(q)+' '+U(n)}
function stepOf(u){return INTU[u]?1:'any'}
function tone(d){return d<=0?'bad':(d<=3?'warn':'ok')}
function dlabel(d){
  if(d<-1)return 'Hết hạn '+(-d)+' ngày';
  if(d===-1)return 'Hết hạn hôm qua';
  if(d===0)return 'Hết hạn hôm nay';
  if(d>=60)return 'Còn ~'+Math.round(d/30)+' tháng';
  return 'Còn '+d+' ngày';
}
function findB(id){return S.batches.filter(function(b){return b.id===id})[0]}
function dishById(id){return S.dishes.filter(function(d){return d.id===id})[0]}
function dishByName(n){var k=norm(n);return S.dishes.filter(function(d){return norm(d.n)===k})[0]}
function el(id){return document.getElementById(id)}

/* ===== Kho theo đợt ===== */
function groupProds(list){
  var m={};
  list.forEach(function(b){(m[b.name]=m[b.name]||[]).push(b)});
  return Object.keys(m).map(function(n){
    var bs=m[n].slice().sort(function(a,b){return a.exp<b.exp?-1:(a.exp>b.exp?1:0)});
    var t=0,v=0,li='';bs.forEach(function(b){t+=b.qty;v+=b.qty*b.cost;if(b.imp>li)li=b.imp});
    return {name:n,bs:bs,total:t,value:v,minD:daysLeft(bs[0]),loc:bs[0].loc,lastImp:li};
  });
}
function prods(){return groupProds(S.batches).sort(function(a,b){return a.minD-b.minD})}
function usable(n){return S.batches.filter(function(b){return b.name===n&&daysLeft(b)>=0}).sort(function(a,b){return a.exp<b.exp?-1:(a.exp>b.exp?1:0)})}
function avail(n){var t=0;usable(n).forEach(function(b){t+=b.qty});return t}
function avgCost(n){var q=0,v=0;usable(n).forEach(function(b){q+=b.qty;v+=b.qty*b.cost});var c=cat(n);return q>0?v/q:(c?c.c:0)}
function dishCost(ds){var c=0;ds.i.forEach(function(x){c+=x[1]*avgCost(x[0])});return c}
function dishMax(ds){var n=1e9;ds.i.forEach(function(x){n=Math.min(n,Math.floor((avail(x[0])+1e-9)/x[1]))});return n===1e9?0:n}
function dishMissing(ds){return ds.i.filter(function(x){return avail(x[0])+1e-9<x[1]}).map(function(x){return x[0]})}
function portionsWith(ds,b,qty){
  var n=1e9;
  ds.i.forEach(function(x){var av=x[0]===b.name?Math.min(qty,b.qty):avail(x[0]);n=Math.min(n,Math.floor((av+1e-9)/x[1]))});
  return n===1e9?0:n;
}
function clean(){S.batches=S.batches.filter(function(b){return b.qty>1e-9})}
function deduct(n,qty){
  var left=qty,cost=0;
  usable(n).forEach(function(b){
    if(left<=1e-9)return;
    var t=Math.min(b.qty,left);
    b.qty=Math.round((b.qty-t)*1000)/1000;left=Math.round((left-t)*1000)/1000;cost+=t*b.cost;
  });
  clean();
  return {cost:cost,short:left};
}
function deductBatch(b,qty){var t=Math.min(b.qty,qty);b.qty=Math.round((b.qty-t)*1000)/1000;clean();return {t:t,cost:t*b.cost}}
function addLog(o){o.id=S.uid++;if(!o.d)o.d=plus(0);S.log.push(o)}
function addBatch(n,q,c,exp,loc,src,imp){
  S.batches.push({id:S.uid++,name:n,qty:q,cost:c,exp:exp,loc:loc,imp:imp||plus(0)});
  addLog({type:'in',name:n,qty:q,value:q*c,src:src||'Nhập tay',d:imp||plus(0)});
}
function addEv(text,tn){S.events.push({id:S.uid++,text:text,tone:tn||'neutral',d:plus(0)})}
function stockValue(){var v=0;S.batches.forEach(function(b){v+=b.qty*b.cost});return v}

}

/* ===== Thống kê ===== */
function inR(l,r){return !r||(l.d>=r.from&&l.d<=r.to)}
function stats(r){
  var s={portions:0,saleRev:0,saleCost:0,useCost:0,sellRev:0,sellCost:0,sellN:0,donate:0,donateN:0,waste:0,wasteN:0,adjust:0,inV:0,repRev:0,repCost:0,repN:0};
  S.log.forEach(function(l){
    if(!inR(l,r))return;
    if(l.type==='in')s.inV+=l.value;
    else if(l.type==='sale'){s.portions+=l.portions;s.saleRev+=l.revenue;s.saleCost+=l.cost;if(l.src==='repurpose'){s.repRev+=l.revenue;s.repCost+=l.cost;s.repN+=l.portions}}
    else if(l.type==='use')s.useCost+=l.cost;
    else if(l.type==='sell'){s.sellRev+=l.revenue;s.sellCost+=l.cost;s.sellN++}
    else if(l.type==='donate'){s.donate+=l.cost;s.donateN++}
    else if(l.type==='waste'){s.waste+=l.cost;s.wasteN++}
    else if(l.type==='adjust')s.adjust+=l.cost;
  });
  s.rev=s.saleRev+s.sellRev;
  s.cogs=s.saleCost+s.useCost+s.sellCost;
  s.profit=s.rev-s.cogs-s.donate-s.waste-s.adjust;
  s.out=s.cogs+s.donate+s.waste+s.adjust;
  return s;
}
function wasteGroups(r){
  var m={};
  S.log.forEach(function(l){
    if(l.type!=='waste'||!inR(l,r))return;
    var g=m[l.name]||(m[l.name]={name:l.name,qty:0,cost:0,n:0,rs:{}});
    g.qty+=l.qty;g.cost+=l.cost;g.n++;g.rs[l.reason]=(g.rs[l.reason]||0)+1;
  });
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.cost-a.cost});
}
function reasonTotals(rg){var r={};S.log.forEach(function(l){if(l.type==='waste'&&inR(l,rg))r[l.reason]=(r[l.reason]||0)+l.cost});return r}
function topKey(o){var b=null;Object.keys(o).forEach(function(k){if(b===null||o[k]>o[b])b=k});return b}
function insights(){
  var gs=wasteGroups(),out=[];
  if(!gs.length)return ['Chưa có dữ liệu bỏ đi. AI sẽ phân tích khi có thêm lịch sử.'];
  var rt=reasonTotals(),tk=topKey(rt);
  out.push('Hao hụt lớn nhất đến từ '+cap(gs[0].name)+' (~'+money(gs[0].cost)+'), lí do nhiều nhất toàn kho: '+String(tk).toLowerCase()+'.');
  if(tk==='Hết hạn')out.push('Phần lớn hao hụt do hết hạn: ưu tiên quyên góp, bán thu mua hoặc nấu món mới trước hạn 2 ngày.');
  if(tk==='Hỏng/ôi thiu')out.push('Nhiều đồ bị hỏng khi còn hạn: kiểm tra nhiệt độ tủ lạnh và cách bảo quản.');
  if(tk==='Nhập dư')out.push('Nhập dư là lí do chính: giảm lượng nhập theo gợi ý ở mục Nhập–xuất của Trợ lí AI.');
  out.push('Xem nhận xét chi tiết theo từng sản phẩm ở Trợ lí AI, mục Nhập–xuất.');
  return out;
}
function reasonText(rs){return Object.keys(rs).map(function(k){return k+' ×'+rs[k]}).join(', ')}
function productInsights(){
  return wasteGroups().slice(0,5).map(function(g){
    var c=cat(g.name),us=usual(g.name),obs=[];
    if(g.rs['Nhập dư'])obs.push('Từng nhập vượt nhu cầu '+g.rs['Nhập dư']+' lần.');
    if(c&&c.d<=4)obs.push('Hạn dùng ngắn (~'+c.d+' ngày), dễ hết hạn nếu nhập nhiều một lần.');
    if(g.rs['Hết hạn']&&!g.rs['Nhập dư']&&!(c&&c.d<=4))obs.push('Dùng không kịp trước hạn '+g.rs['Hết hạn']+' lần.');
    if(g.rs['Hỏng/ôi thiu'])obs.push('Hỏng khi còn hạn '+g.rs['Hỏng/ôi thiu']+' lần, nên xem lại cách bảo quản.');
    if(g.rs['Khác'])obs.push('Có '+g.rs['Khác']+' lần bỏ vì lí do khác, xem ghi chú ở Thống kê.');
    if(S.events.some(function(e){return e.text.indexOf('bất thường')>-1&&e.text.indexOf(g.name)>-1}))obs.push('Đã có lần AI cảnh báo nhập số lượng bất thường.');
    var rec=us?'Nhập '+fmt(us[0])+'–'+fmt(us[1])+' '+U(g.name)+' mỗi lần'+(c&&c.d<=4?', chia 2 lần mỗi tuần':'')+'.':'Giảm khoảng 20–30% so với lần nhập gần nhất.';
    var tip=(g.rs['Hỏng/ôi thiu']&&c&&c.tip)?' Bảo quản: '+c.tip:'';
    return '<div class="card"><div class="row-top"><div class="grow"><span class="nm">'+esc(cap(g.name))+'</span><span class="sub">Đã bỏ '+qs(g.name,g.qty)+' qua '+g.n+' lần</span></div><span class="tag bad">~'+money(g.cost)+'</span></div>'+
      '<div class="ins"><b>Lí do</b><span>'+esc(reasonText(g.rs))+'</span></div>'+
      '<div class="ins"><b>Nhận xét</b><span>'+esc(obs.join(' ')||'Chưa có nhận xét thêm.')+'</span></div>'+
      '<div class="ins"><b>Gợi ý lần nhập tới</b><span>'+esc(rec+tip)+'</span></div></div>';
  }).join('');
}

/* ===== Gợi ý xử lí ===== */
function suggest(b){
  var best=null;
  S.dishes.forEach(function(ds){
    if(!ds.i.some(function(x){return x[0]===b.name}))return;
    var n=portionsWith(ds,b,b.qty);
    if(n>0){var pf=(ds.price-dishCost(ds))*n;if(!best||pf>best.pf)best={ds:ds,n:n,pf:pf}}
  });
  if(best)return {text:'nấu '+best.ds.n+' ('+best.n+' phần, lãi gộp dự kiến '+money(best.pf)+'), hoặc quyên góp, bán thu mua.',ds:best.ds,n:best.n};
  return {text:'quyên góp hoặc bán cho chỗ thu mua để không phải bỏ.',ds:null,n:0};
}

function notifs(){
  var o=[],names={},t0=plus(0);
  S.batches.slice().sort(function(a,b){return a.exp<b.exp?-1:1}).forEach(function(b){
    names[b.name]=1;
    var d=daysLeft(b);
    if(d<0)o.push({k:'x'+b.id,g:0,d:t0,tone:'bad',t:cap(b.name)+' đã hết hạn',x:'Đợt nhập '+dmy(b.imp)+': '+qs(b.name,b.qty)+'. Nên bỏ khỏi kho và ghi nhận hao hụt.',a:{l:'Xem',act:'detail',name:b.name}});
    else if(d<=2)o.push({k:'s'+b.id+'_'+d,g:0,d:t0,tone:'warn',t:cap(b.name)+(d===0?' hết hạn hôm nay':' còn '+d+' ngày'),x:'AI gợi ý: '+suggest(b).text,a:{l:'Xử lí',act:'proc',id:b.id}});
    else if(d===3)o.push({k:'r'+b.id,g:1,d:t0,tone:'neutral',t:cap(b.name)+' còn 3 ngày',x:'Lên kế hoạch dùng đợt nhập '+dmy(b.imp)+' ('+qs(b.name,b.qty)+') trong thực đơn tuần này.'});
  });
  S.log.forEach(function(l){if(l.name)names[l.name]=1});
  var low=0;
  Object.keys(names).forEach(function(n){
    var us=usual(n);if(!us||low>=2)return;
    var av=avail(n);
    if(av<us[0]*0.5){low++;o.push({k:'l'+n+Math.round(av*10),g:1,d:t0,tone:'warn',t:'Sắp hết '+n,x:'Chỉ còn '+qs(n,av)+' dùng được. Mức nhập thường là '+fmt(us[0])+'–'+fmt(us[1])+' '+U(n)+'.'})}
  });
  S.events.forEach(function(e){o.push({k:'e'+e.id,g:(e.tone==='neutral'?2:0),d:e.d,tone:e.tone,t:e.text.split('|')[0],x:e.text.split('|')[1]||''})});
  S.log.filter(function(l){return l.d>=plus(-14)&&l.name!==HIST}).forEach(function(l){
    var t,x;
    if(l.type==='in'){t='Nhập kho';x=qs(l.name,l.qty)+' '+l.name+' · '+money(l.value)}
    else if(l.type==='sale'){t='Xuất kho';x=l.portions+' phần '+l.dish+' · doanh thu '+money(l.revenue)}
    else if(l.type==='use'){t='Xuất kho';x=qs(l.name,l.qty)+' '+l.name+' dùng trực tiếp'}
    else if(l.type==='donate'){t='Quyên góp';x=qs(l.name,l.qty)+' '+l.name}
    else if(l.type==='sell'){t='Bán thu mua';x=qs(l.name,l.qty)+' '+l.name+' · thu '+money(l.revenue)}
    else if(l.type==='waste'){t='Bỏ đi';x=qs(l.name,l.qty)+' '+l.name+' · '+l.reason+(l.note?': '+l.note:'')}
    else return;
    o.push({k:'g'+l.id,g:2,d:l.d,tone:'neutral',t:t+' ngày '+dmy(l.d),x:x});
  });
  return o;
}

/* ===== Màn hình: Kho ===== */
function impDates(){var m={};S.batches.forEach(function(b){m[b.imp]=1});return Object.keys(m).sort().reverse()}
function khoProds(){
  var q=norm(kq.trim()),pr=null;
  if(kdate==='today')pr=function(b){return b.imp===plus(0)};
  else if(kdate==='7')pr=function(b){return b.imp>=plus(-6)};
  else if(kdate!=='all')pr=function(b){return b.imp===kdate};
  var list=S.batches.filter(function(b){return (!pr||pr(b))&&(!q||norm(b.name).indexOf(q)>-1)});
  var ps=groupProds(list).filter(function(p){return filter==='all'||p.loc===filter});
  if(ksort==='exp')ps.sort(function(a,b){return a.minD-b.minD});
  else if(ksort==='imp')ps.sort(function(a,b){return a.lastImp<b.lastImp?1:(a.lastImp>b.lastImp?-1:0)});
  else ps.sort(function(a,b){return a.name.localeCompare(b.name,'vi')});
  return ps;
}
function khoList(){
  var ps=khoProds();
  if(!ps.length)return '<div class="empty">Không tìm thấy món nào khớp bộ lọc. Thử đổi từ khóa hoặc chọn "Tất cả đợt nhập".</div>';
  return '<div class="list">'+ps.map(function(p){
    var t=tone(p.minD),multi=p.bs.length>1;
    return '<button class="prow" data-act="detail" data-name="'+esc(p.name)+'" aria-label="Xem chi tiết '+esc(p.name)+'">'+
      '<div class="av '+t+'" aria-hidden="true">'+esc(cap(p.name).charAt(0))+'</div>'+
      '<div class="grow"><span class="nm">'+esc(cap(p.name))+'</span><span class="sub">'+qs(p.name,p.total)+' · '+LOC[p.loc]+(multi?' · '+p.bs.length+' đợt nhập':'')+'</span></div>'+
      '<span class="tag '+t+'">'+dlabel(p.minD)+'</span></button>';
  }).join('')+'</div>';
}

  var fl=[['all','Tất cả · '+all.length],['fridge','Tủ lạnh · '+cnt('fridge')],['pantry','Tủ bếp · '+cnt('pantry')],['freezer','Ngăn đông · '+cnt('freezer')]];

/* ===== Màn hình: Thực đơn ===== */
function dishRank(){
  return S.dishes.map(function(ds){
    var cost=dishCost(ds),pr=ds.price,mx=dishMax(ds),ex=0;
    ds.i.forEach(function(x){if(usable(x[0]).some(function(b){return daysLeft(b)<=3}))ex++});
    return {ds:ds,cost:cost,pr:pr,pf:pr-cost,mg:pr>0?(pr-cost)/pr:0,mx:mx,ex:ex,miss:dishMissing(ds)};
  }).sort(function(a,b){return ((b.mx>0?100:0)+b.ex*10+b.mg*10)-((a.mx>0?100:0)+a.ex*10+a.mg*10)});
}

function aiKho(){
  var ps=prods(),sv=stockValue(),n=ps.length;
  var byLoc={fridge:0,pantry:0,freezer:0},byTone={ok:0,warn:0,bad:0};
  ps.forEach(function(p){byLoc[p.loc]++;byTone[p.minD<0?'bad':(p.minD<=3?'warn':'ok')]++});
  var h='<div class="card"><h3>Tổng quan kho</h3><div class="kv"><span>Số mặt hàng</span><b>'+n+'</b></div><div class="kv"><span>Số đợt hàng còn tồn</span><b>'+S.batches.length+'</b></div><div class="kv"><span>Giá trị tồn kho</span><b>'+money(sv)+'</b></div>'+
    '<span class="sub">Mỗi lần nhập của một mặt hàng là một đợt. Ví dụ thịt ba rọi nhập 2 lần thì tính 1 mặt hàng và 2 đợt.</span></div>';
  h+='<div class="card"><h3>Theo nơi cất (số mặt hàng)</h3>'+Object.keys(byLoc).map(function(l){return '<div><div class="kv" style="border:none;padding:0 0 4px"><span>'+LOC[l]+'</span><b>'+byLoc[l]+' mặt hàng</b></div><div class="hbar"><i style="width:'+(n?byLoc[l]/n*100:0)+'%"></i></div></div>'}).join('')+'</div>';
  h+='<div class="card"><h3>Theo tình trạng (số mặt hàng)</h3><div class="kv"><span>Còn lâu</span><b>'+byTone.ok+' mặt hàng</b></div><div class="kv"><span>Sắp hết hạn (trong 3 ngày)</span><b>'+byTone.warn+' mặt hàng</b></div><div class="kv"><span>Đã có đợt hết hạn</span><b>'+byTone.bad+' mặt hàng</b></div><span class="sub">Mỗi mặt hàng tính theo đợt hết hạn sớm nhất của nó.</span></div>';
  var need=[],over=[],seen={};
  S.batches.forEach(function(b){seen[b.name]=1});S.log.forEach(function(l){if(l.name)seen[l.name]=1});
  Object.keys(seen).forEach(function(nm){
    var us=usual(nm);if(!us)return;var av=avail(nm);
    if(av<us[0]*0.5)need.push(cap(nm)+': còn '+qs(nm,av)+', mức thường '+fmt(us[0])+'–'+fmt(us[1]));
    else if(av>us[1]*2)over.push(cap(nm)+': đang có '+qs(nm,av)+', mức thường '+fmt(us[0])+'–'+fmt(us[1]));

  var li=function(a,e){return a.length?a.map(function(t){return '<span class="sub" style="font-size:13px;color:var(--ink)">• '+esc(t)+'</span>'}).join(''):'<span class="sub">'+e+'</span>'};

function answer(q){
  var n=norm(q),names=Object.keys(P).concat(Object.keys(S.custom)).filter(function(k){return n.indexOf(norm(k))>-1});
  if(names.length&&/con|bao nhieu|ton|het|dang co/.test(n)){
    return names.map(function(nm){
      var bs=S.batches.filter(function(b){return b.name===nm});
      if(!bs.length)return cap(nm)+': kho đang không có.';
      var t=0;bs.forEach(function(b){t+=b.qty});
      return cap(nm)+': còn '+qs(nm,t)+' ('+bs.length+' đợt).\n'+bs.map(function(b){return '• Nhập '+dmy(b.imp)+': '+qs(nm,b.qty)+', '+dlabel(daysLeft(b)).toLowerCase()}).join('\n');
    }).join('\n\n');
  }
  if(/xu li|xu ly|hom nay|sap het|uu tien/.test(n)){
    var bs2=S.batches.filter(function(b){return daysLeft(b)<=2}).sort(function(a,b){return a.exp<b.exp?-1:1});
    if(!bs2.length)return 'Hôm nay chưa có đợt nào cần xử lí gấp.';
    return 'Nên xử lí theo thứ tự:\n'+bs2.map(function(b,i){var d=daysLeft(b);return (i+1)+'. '+cap(b.name)+' '+qs(b.name,b.qty)+' ('+dlabel(d).toLowerCase()+')'+(d>=0?': '+suggest(b).text:': nên bỏ và ghi nhận hao hụt.')}).join('\n');
  }
  if(/lang phi|bo nhieu|bo di|hao hut/.test(n)){
    var g=wasteGroups();if(!g.length)return 'Chưa có dữ liệu bỏ đi.';
    return 'Đồ bỏ nhiều nhất theo giá trị:\n'+g.slice(0,3).map(function(x){return '• '+cap(x.name)+': '+qs(x.name,x.qty)+' (~'+money(x.cost)+')'}).join('\n')+'\n\n'+insights().slice(0,2).join('\n');
  }
  if(/lai|loi nhuan|doanh thu/.test(n)){
    var r=dishRank().filter(function(x){return x.pr>0}).sort(function(a,b){return b.pf-a.pf}),s=stats();
    if(!r.length)return 'Thực đơn chưa có món nào.';
    return 'Món lãi gộp cao nhất mỗi phần: '+r[0].ds.n+' ('+money(r[0].pf)+', biên '+Math.round(r[0].mg*100)+'%).\nTổng doanh thu: '+money(s.rev)+', lợi nhuận sau hao hụt: '+money(s.profit)+'.';
  }
  if(/nau|mon|thuc don|du/.test(n)){
    var d=dishRank().filter(function(x){return x.mx>0}).slice(0,3);
    if(!d.length)return 'Kho chưa đủ nguyên liệu cho món nào.';
    return 'Kho đang đủ để nấu:\n'+d.map(function(x){return '• '+x.ds.n+': tối đa '+x.mx+' phần, lãi '+money(x.pf)+'/phần'}).join('\n');
  }
  if(/nhap/.test(n)){var s2=stats();return 'Tổng nhập từ đầu: '+money(s2.inV)+'. Giá trị còn trong kho: '+money(stockValue())+'.\n'+insights()[0]}
  return 'Mình chưa hiểu câu hỏi này. Bạn thử hỏi về tồn kho một mặt hàng, đồ cần xử lí, món lãi nhất hoặc đồ bỏ nhiều nhất nhé.';
}

  }else if(tkP==='month'){
    var y=+tkMonth.slice(0,4),m=+tkMonth.slice(5),last=+monthEnd(y,m).slice(8);
    r.from=ymd(y,m,1);r.to=monthEnd(y,m);r.label='Tháng '+m+'/'+y;r.bname='từng tuần trong tháng';
    var py=m===1?y-1:y,pm=m===1?12:m-1;r.prev={from:ymd(py,pm,1),to:monthEnd(py,pm),label:'tháng trước'};
    [1,8,15,22,29].forEach(function(st){if(st>last)return;var e=Math.min(st+6,last);r.buckets.push({l:'Ngày '+st+'–'+e,from:ymd(y,m,st),to:ymd(y,m,e)})});
  }else if(tkP==='quarter'){
    var qy=+tkQ.slice(0,4),q=+tkQ.slice(5),m1=(q-1)*3+1;
    r.from=ymd(qy,m1,1);r.to=monthEnd(qy,m1+2);r.label='Quý '+q+'/'+qy+' (tháng '+m1+'–'+(m1+2)+')';r.bname='từng tháng trong quý';
    var pq=q===1?4:q-1,pqy=q===1?qy-1:qy,pm1=(pq-1)*3+1;r.prev={from:ymd(pqy,pm1,1),to:monthEnd(pqy,pm1+2),label:'quý trước'};
    for(i=0;i<3;i++)r.buckets.push({l:'Tháng '+(m1+i),from:ymd(qy,m1+i,1),to:monthEnd(qy,m1+i)});
  }else{

    var n=diffD(f,t)+1;r.from=f;r.to=t;r.label='Đợt từ '+dmyy(f)+' đến '+dmyy(t)+' ('+n+' ngày)';r.prev={from:addD(f,-n),to:addD(f,-1),label:'đợt liền trước cùng độ dài'};

  }
  return r;
}

}

    S.log.forEach(function(l){if(l.type!=='sale'||!inR(l,R))return;var g=m[l.dish]||(m[l.dish]={n:l.dish,p:0,r:0,c:0});g.p+=l.portions;g.r+=l.revenue;g.c+=l.cost});
    var ds=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return (b.r-b.c)-(a.r-a.c)});
    h+='<div class="h3">Lợi nhuận theo món trong kỳ</div><div class="list">'+(ds.length?ds.map(function(g){
      var pf=g.r-g.c;
      return '<div class="row"><div class="row-top"><div class="grow"><span class="nm">'+esc(g.n)+'</span><span class="sub">'+g.p+' phần · doanh thu '+money(g.r)+' · giá vốn '+money(g.c)+'</span></div><span class="tag '+(pf>=0?'ok':'bad')+'">'+money(pf)+'</span></div></div>';
    }).join(''):'<div class="note">Chưa có món nào được bán trong kỳ này.</div>')+'</div>';
  }else if(tkSub==='xuly'){
    var saved=s.donate+s.sellCost+s.repCost,back=s.sellRev+s.repRev;
    h+='<div class="card"><h3>Đã xử lí, không phải bỏ</h3><div class="kv"><span>Giá trị hàng được cứu</span><b>'+money(saved)+'</b></div><div class="kv"><span>Thu về từ thu mua và món mới</span><b>'+money(back)+'</b></div><span class="sub">Phần này tách riêng khỏi Đã bỏ, vì hàng vẫn dùng được và mang lại giá trị.</span></div>';
    var rows=[['Quyên góp',s.donateN+' lần','Giá trị '+money(s.donate)],['Bán cho chỗ thu mua',s.sellN+' lần','Thu về '+money(s.sellRev)+' trên giá vốn '+money(s.sellCost)],['Làm món mới',s.repN+' phần','Doanh thu '+money(s.repRev)+', giá vốn '+money(s.repCost)]];
    h+=rows.map(function(r){return '<div class="card"><div class="row-top"><span class="nm grow">'+r[0]+'</span><span class="tag neutral">'+r[1]+'</span></div><span class="sub">'+r[2]+'</span></div>'}).join('');
    var rec=S.log.filter(function(l){return inR(l,R)&&(l.type==='donate'||l.type==='sell'||(l.type==='sale'&&l.src==='repurpose'))}).slice().reverse().slice(0,8);
    h+='<div class="h3">Trong kỳ</div><div class="list">'+(rec.length?rec.map(function(l){
      var t=l.type==='donate'?'Quyên góp '+qs(l.name,l.qty)+' '+l.name:(l.type==='sell'?'Bán thu mua '+qs(l.name,l.qty)+' '+l.name:'Nấu '+l.portions+' phần '+l.dish);
      return '<div class="row"><div class="row-top"><div class="grow"><span class="nm">'+esc(t)+'</span><span class="sub">'+dmy(l.d)+'</span></div></div></div>';
    }).join(''):'<div class="note">Chưa có mục nào trong kỳ này.</div>')+'</div>';
  }else{
    var rt=reasonTotals(R),gs=wasteGroups(R);
    h+='<div class="card"><h3>Đã bỏ</h3><div class="kv"><span>Số lần bỏ</span><b>'+s.wasteN+'</b></div><div class="kv"><span>Giá trị hao hụt</span><b style="color:var(--bad-fg)">'+money(s.waste)+'</b></div><div class="kv"><span>So với '+esc(R.prev.label)+'</span><b>'+(isPartial(R)?'Chưa so sánh (kỳ chưa kết thúc)':delta(s.waste,ps.waste,R.prev.label).replace(' so với '+R.prev.label,''))+'</b></div></div>';
    if(s.waste>0){
      h+='<div class="card"><h3>Theo lí do</h3>'+Object.keys(rt).sort(function(a,b){return rt[b]-rt[a]}).map(function(k){return '<div><div class="kv" style="border:none;padding:0 0 4px"><span>'+k+'</span><b>'+money(rt[k])+'</b></div><div class="hbar"><i style="width:'+(rt[k]/s.waste*100)+'%;background:var(--bad-fg)"></i></div></div>'}).join('')+'</div>';
      h+='<div class="card"><h3>Theo mặt hàng</h3>'+gs.slice(0,4).map(function(g){return '<div class="kv"><span>'+esc(cap(g.name))+' · '+g.n+' lần</span><b>'+money(g.cost)+'</b></div>'}).join('')+'</div>';
    }
    h+='<div class="card" style="border:2px solid var(--accent-text)"><h3>AI phân tích cho lần nhập tới</h3><span class="sub">AI phân tích trên toàn bộ lịch sử, không chỉ riêng kỳ đang xem.</span>'+insights().map(function(t){return '<span class="sub" style="font-size:13px;color:var(--ink)">• '+esc(t)+'</span>'}).join('')+'</div>';
    var rec2=S.log.filter(function(l){return l.type==='waste'&&inR(l,R)}).slice().reverse().slice(0,8);
    h+='<div class="h3">Trong kỳ</div><div class="list">'+(rec2.length?rec2.map(function(l){
      return '<div class="row"><div class="row-top"><div class="grow"><span class="nm">'+esc(cap(l.name))+' · '+qs(l.name,l.qty)+'</span><span class="sub">'+dmy(l.d)+' · '+esc(l.reason)+(l.note?': '+esc(l.note):'')+'</span></div><span class="tag bad">'+money(l.cost)+'</span></div></div>';
    }).join(''):'<div class="note">Không có mục nào bị bỏ trong kỳ này.</div>')+'</div>';
  }
  return h;
}

/* ===== Lớp phủ ===== */
function wrap(id,title,body,back){
  return '<div class="ov" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="'+id+'"><div class="sheet-hd">'+
    (back?'<button class="ibtn" data-act="back" aria-label="Quay lại">'+ic('back',22)+'</button>':'')+'<h2 id="'+id+'">'+title+'</h2><button class="ibtn" data-act="close" aria-label="Đóng">'+ic('x',22)+'</button></div>'+body+'</div></div>';
}
function abnormal(n,q){
  var us=usual(n);if(!us||!(q>0))return null;
  if(q>us[1]*2)return 'Thường nhập '+fmt(us[0])+'–'+fmt(us[1])+' '+U(n)+' mỗi lần, lần này '+fmt(q)+' '+U(n)+' (gấp '+fmt(q/us[1])+' lần mức cao nhất). Có thể nhập nhầm đơn vị hoặc nhập dư.';
  return null;
}
function reading(){
  return '<div class="rcpt"><svg width="120" height="130" viewBox="0 0 130 150" role="img" aria-label="Chứng từ mẫu"><rect width="130" height="150" rx="6" fill="#F4F7F2"/><rect x="16" y="16" width="60" height="7" rx="3" fill="#8A968D"/>'+[40,54,68,82,96].map(function(y,i){return '<rect x="16" y="'+y+'" width="'+(98-i*6)+'" height="5" rx="2" fill="#B9C3BB"/>'}).join('')+'<rect x="16" y="124" width="98" height="7" rx="3" fill="#8A968D"/></svg>'+(scan.phase==='reading'?'<div class="scanline"></div>':'')+'</div>';
}

/* --- Quét: dòng nhập --- */
function inHint(r){
  var c=cat(r.n),tot=num0(r.q)*num0(r.c);
  return money(tot)+' · '+(c?'AI gợi ý: cất '+LOC[c.l].toLowerCase()+', hạn dùng ~'+c.d+' ngày':'Món mới, bạn sẽ chọn nơi cất khi thêm vào kho');
}
function inWarn(r){
  var w=abnormal(r.n,r.q);
  return w?'<div class="warnbox"><b>Cảnh báo số lượng nhập bất thường</b><span>'+esc(w)+'</span><span>Sửa lại số lượng ở trên nếu nhập nhầm, hoặc tích chọn dòng nếu số lượng đúng.</span></div>':'';
}
function inRowHtml(r,i){
  return '<div class="row" id="sr'+i+'"><div class="row-top"><input type="checkbox" class="cbx" id="r'+i+'" data-act="scanToggle" data-i="'+i+'"'+(r.on?' checked':'')+' aria-label="Chọn dòng '+(i+1)+'">'+
    '<input class="inp" list="dl" value="'+esc(r.n)+'" placeholder="Tên món" data-sf="n" data-i="'+i+'" aria-label="Tên món dòng '+(i+1)+'"><button class="ibtn" data-act="scanDel" data-i="'+i+'" aria-label="Xóa dòng '+(i+1)+'">'+ic('trash',20)+'</button></div>'+
    '<div class="f3"><label class="fl">Số lượng<input class="inp" type="number" min="0" step="any" value="'+esc(r.q)+'" data-sf="q" data-i="'+i+'"></label>'+
    '<label class="fl">Đơn vị<input class="inp" list="ul" value="'+esc(r.u||U(r.n))+'" data-sf="u" data-i="'+i+'"></label>'+
    '<label class="fl">Giá nhập (đ)<input class="inp" type="number" min="0" step="any" value="'+esc(r.c)+'" data-sf="c" data-i="'+i+'"></label></div>'+
    '<div class="sub" id="rt'+i+'">'+esc(inHint(r))+'</div><div id="rw'+i+'">'+inWarn(r)+'</div></div>';
}
/* --- Quét: dòng xuất --- */
function needsOf(r){
  var need={};
  if(r.k==='dish'){var ds=dishByName(r.dn);if(ds)ds.i.forEach(function(x){need[x[0]]=x[1]*num0(r.p)})}
  else if(r.n)need[r.n]=num0(r.q);
  return need;
}
function outPreview(r){
  if(r.k==='dish'){
    var ds=dishByName(r.dn);
    if(!ds)return 'Món này không còn trong thực đơn.';
    return 'Doanh thu '+money(num0(r.p)*ds.price)+' · trừ: '+ds.i.map(function(x){return fmt(x[1]*num0(r.p))+' '+U(x[0])+' '+x[0]}).join(', ');
  }
  return r.n?'Nguyên liệu dùng trực tiếp, trừ thẳng khỏi kho (đang có '+qs(r.n,avail(r.n))+' dùng được)':'Nhập tên nguyên liệu';
}
function outRowHtml(r,i){
  var top;
  if(r.k==='dish'){
    var found=!!dishByName(r.dn);
    top='<select class="inp" data-sf="dn" data-i="'+i+'" aria-label="Món dòng '+(i+1)+'">'+(found?'':'<option selected>'+esc(r.dn)+'</option>')+S.dishes.map(function(d){return '<option'+(norm(d.n)===norm(r.dn)?' selected':'')+'>'+esc(d.n)+'</option>'}).join('')+'</select>';
  }else top='<input class="inp" list="dl" value="'+esc(r.n)+'" placeholder="Tên nguyên liệu" data-sf="n" data-i="'+i+'" aria-label="Nguyên liệu dòng '+(i+1)+'">';
  var field=r.k==='dish'?'<label class="fl">Số phần bán<input class="inp" type="number" min="0" step="1" value="'+esc(r.p)+'" data-sf="p" data-i="'+i+'"></label>':
    '<label class="fl">Số lượng ('+esc(U(r.n))+')<input class="inp" type="number" min="0" step="any" value="'+esc(r.q)+'" data-sf="q" data-i="'+i+'"></label>';
  return '<div class="row" id="sr'+i+'"><div class="row-top"><input type="checkbox" class="cbx" id="o'+i+'" data-act="outToggle" data-i="'+i+'"'+(r.on?' checked':'')+' aria-label="Chọn dòng '+(i+1)+'">'+top+'<button class="ibtn" data-act="scanDel" data-i="'+i+'" aria-label="Xóa dòng '+(i+1)+'">'+ic('trash',20)+'</button></div>'+
    '<div style="max-width:50%">'+field+'</div><div class="sub" id="ro'+i+'">'+esc(outPreview(r))+'</div></div>';
}
function outNeeds(){
  var need={},rev=0;
  scan.rows.forEach(function(r){
    if(!r.on)return;
    var nd=needsOf(r);
    Object.keys(nd).forEach(function(k){need[k]=(need[k]||0)+nd[k]});
    if(r.k==='dish'){var ds=dishByName(r.dn);if(ds)rev+=num0(r.p)*ds.price}
  });
  var short=[];
  Object.keys(need).forEach(function(n){var av=avail(n);if(need[n]>av+1e-9)short.push({n:n,need:need[n],av:av})});
  return {need:need,rev:rev,short:short};
}
function scanRowsHtml(){return scan.rows.map(function(r,i){return scan.tab==='in'?inRowHtml(r,i):outRowHtml(r,i)}).join('')}
function scanInfoHtml(){
  if(scan.tab==='in'){
    var n=0,ab=0,tot=0;
    scan.rows.forEach(function(r){if(r.on&&r.n&&num0(r.q)>0){n++;tot+=num0(r.q)*num0(r.c)}if(abnormal(r.n,r.q))ab++});
    return '<div class="kv" style="margin-top:8px"><span>Tổng tiền các dòng đã chọn</span><b>'+money(tot)+'</b></div>'+(ab?'<div class="note">Có '+ab+' dòng bất thường. Dòng bất thường chưa được chọn, hãy sửa số lượng hoặc tích chọn nếu đúng.</div>':'');
  }
  var nd=outNeeds(),h='';
  if(nd.short.length)h+='<div class="warnbox" style="margin-top:10px"><b>Đối chiếu kho: có thiếu hụt</b>'+nd.short.map(function(x){return '<span>'+esc(cap(x.n))+': báo cáo dùng '+qs(x.n,x.need)+', kho chỉ còn '+qs(x.n,x.av)+' (thiếu '+qs(x.n,x.need-x.av)+'). Có thể quên nhập hóa đơn hoặc báo cáo ghi dư.</span>'}).join('')+'<span>AI sẽ trừ hết số đang có và gửi nhắc vào chuông thông báo.</span></div>';
  else h+='<div class="okbox" style="margin-top:10px"><b>Đối chiếu kho: khớp</b><span>Kho đủ nguyên liệu cho các dòng đã chọn.</span></div>';
  return h+'<div class="kv" style="margin-top:8px"><span>Doanh thu theo báo cáo</span><b>'+money(nd.rev)+'</b></div>';
}
function scanBtnState(){
  var n=scan.rows.filter(function(r){return r.on&&(scan.tab==='in'?(r.n&&num0(r.q)>0):(r.k==='dish'?(dishByName(r.dn)&&num0(r.p)>0):(r.n&&num0(r.q)>0)))}).length;
  return {n:n,label:scan.tab==='in'?'Thêm '+n+' đợt vào kho':'Xác nhận trừ kho ('+n+' dòng)',dis:n===0};
}
function updScanFoot(){
  var i=el('sc-info');if(i)i.innerHTML=scanInfoHtml();
  var b=el('sc-go');if(b){var st=scanBtnState();b.textContent=st.label;b.disabled=st.dis}
}
function updScanCount(){var c=el('sc-count');if(c)c.textContent='AI đọc được '+scan.rows.length+' dòng'+(scan.file?' từ '+scan.file:'')}
function vScan(){
  var seg='<div class="seg"><button class="'+(scan.tab==='in'?'on':'')+'" data-act="scanTab" data-t="in">Nhập kho (hóa đơn)</button><button class="'+(scan.tab==='out'?'on':'')+'" data-act="scanTab" data-t="out">Xuất kho (báo cáo)</button></div>';
  var b=seg+'<input type="file" id="sc-file" hidden accept=".csv,.txt,.xlsx,.xls,.pdf,image/*"><input type="file" id="sc-cam" hidden accept="image/*" capture="environment">';
  if(scan.phase==='idle'){
    b+=reading();
    b+='<p class="sub" style="margin:10px 0 0">'+(scan.tab==='in'?'Chụp hóa đơn mua hàng. AI đọc tên món, số lượng, giá và cảnh báo nếu số lượng khác thường.':'Chụp báo cáo bán hàng hoặc phiếu dùng nguyên liệu cuối ngày. AI trừ kho theo định lượng từng món và đối chiếu với số lượng đang có.')+'</p>';
    b+='<button class="btn primary full" style="margin-top:14px" data-act="pickCam">'+ic('scan',18)+(scan.tab==='in'?'Chụp hóa đơn bằng camera':'Chụp báo cáo bằng camera')+'</button>';
    b+='<div class="btns" style="margin-top:8px"><button class="btn outline" data-act="doScan">'+(scan.tab==='in'?'Quét hóa đơn mẫu':'Quét báo cáo mẫu')+'</button><button class="btn outline" data-act="pickFile">'+ic('up',18)+'Nhập file</button></div>';
    b+='<div class="note">Chụp ảnh: bản demo chưa đọc chữ trong ảnh nên vẫn dùng dữ liệu mẫu, bản thật sẽ đọc bằng OCR. Nhập file: CSV được đọc thật, mỗi dòng '+(scan.tab==='in'?'"tên món, số lượng, đơn vị, giá nhập" (đơn vị và giá có thể bỏ trống)':'"tên món hoặc nguyên liệu, số lượng"')+'. Ảnh, PDF, Excel trong bản demo dùng dữ liệu mẫu. Sau khi đọc, bạn vẫn sửa và thêm dòng được.</div>';
  }else if(scan.phase==='reading'){
    b+=reading()+'<div class="note" style="text-align:center;font-size:14px;font-weight:600">AI đang đọc '+(scan.file?esc(scan.file):'chứng từ')+'…</div>';
  }else{
    b+='<div class="row-act" style="justify-content:space-between;align-items:center;margin-top:12px"><span style="font-size:14px;font-weight:600" id="sc-count">AI đọc được '+scan.rows.length+' dòng'+(scan.file?' từ '+esc(scan.file):'')+'</span><button class="mini" data-act="pickFile">Nhập file khác</button></div>';
    b+='<div class="note" style="margin-top:2px">Bạn có thể sửa từng dòng hoặc thêm dòng mới trước khi xác nhận.</div>';
    b+='<div class="list" id="sc-list">'+scanRowsHtml()+'</div>';
    if(scan.tab==='in')b+='<button class="btn outline full" style="margin-top:8px" data-act="scanAddRow" data-k="in">'+ic('plus',18)+'Thêm dòng</button>';
    else b+='<div class="btns" style="margin-top:8px"><button class="btn outline" data-act="scanAddRow" data-k="dish">'+ic('plus',18)+'Thêm món</button><button class="btn outline" data-act="scanAddRow" data-k="ing">'+ic('plus',18)+'Thêm nguyên liệu</button></div>';
    var st=scanBtnState();
    b+='<div id="sc-info">'+scanInfoHtml()+'</div><div style="margin-top:10px"><button class="btn primary full" id="sc-go" data-act="'+(scan.tab==='in'?'scanAdd':'outGo')+'"'+(st.dis?' disabled':'')+'>'+st.label+'</button></div>';
    if(scan.tab==='out')b+='<div class="note">Kho trừ theo nguyên tắc hết hạn trước dùng trước, giá vốn lấy từ giá nhập của đúng đợt hàng.</div>';
  }
  return wrap('t-scan','Quét chứng từ',b);
}

/* --- Thông báo --- */
function vBell(){
  var all=notifs(),un=all.filter(function(n){return !S.read[n.k]}).length,gn=['Cần xử lí ngay','Nhắc nhở','Nhập – xuất kho'];
  var b='<div class="row-act" style="justify-content:space-between;align-items:center;margin-top:4px"><span class="sub">'+un+' chưa đọc · '+(all.length-un)+' đã đọc</span><button class="mini p" data-act="readAll"'+(un?'':' disabled')+'>Đọc hết ('+un+')</button></div>';
  b+='<div class="seg"><button class="'+(bellOnly==='all'?'on':'')+'" data-act="bellOnly" data-o="all">Tất cả</button><button class="'+(bellOnly==='unread'?'on':'')+'" data-act="bellOnly" data-o="unread">Chưa đọc</button></div>';
  var dd=[['all','Tất cả ngày'],['today','Hôm nay'],['yest','Hôm qua'],['7','7 ngày']];
  b+='<div class="chips">'+dd.map(function(x){return '<button class="chip'+(bellDate===x[0]?' on':'')+'" data-act="bellDate" data-d="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
  b+='<label class="fl" style="margin-top:8px">Chọn một ngày<input class="inp" type="date" id="b-date" max="'+plus(0)+'" value="'+(bellDate==='pick'?bellPick:'')+'" data-act="bellPick"></label>';
  var list=bellList();
  if(!list.length)b+='<div class="empty">Không có thông báo nào trong bộ lọc này.</div>';
  [0,1,2].forEach(function(g){
    var l=list.filter(function(n){return n.g===g});
    if(!l.length)return;
    b+='<div class="h3">'+gn[g]+' ('+l.length+')</div><div class="list">'+l.map(function(n){
      var rd=!!S.read[n.k];
      return '<div class="row'+(rd?' dim':'')+'"><div class="row-top"><div class="grow"><span class="nm'+(rd?'':' unread')+'" style="font-size:14px">'+esc(n.t)+'</span><span class="sub">'+(n.d===plus(0)?'Hôm nay':dmy(n.d))+' · '+esc(n.x)+'</span></div>'+(n.tone!=='neutral'?'<span class="tag '+n.tone+'">'+(n.tone==='bad'?'Gấp':'Lưu ý')+'</span>':'')+'</div>'+
        '<div class="row-act">'+(rd?'<span class="tag neutral">Đã đọc</span>':'<button class="mini" data-act="readOne" data-k="'+esc(n.k)+'">Đánh dấu đã đọc</button>')+
        (n.a?'<button class="mini p" data-act="'+n.a.act+'"'+(n.a.id?' data-id="'+n.a.id+'"':'')+(n.a.name?' data-name="'+esc(n.a.name)+'"':'')+'>'+n.a.l+'</button>':'')+'</div></div>';
    }).join('')+'</div>';
  });
  return wrap('t-bell','Thông báo',b);
}

/* --- Chi tiết mặt hàng --- */
function vDetail(){
  var name=ov.name,bs=S.batches.filter(function(b){return b.name===name}).sort(function(a,b){return a.imp<b.imp?-1:(a.imp>b.imp?1:(a.exp<b.exp?-1:1))});
  if(!bs.length)return '';
  var t=0,v=0;bs.forEach(function(b){t+=b.qty;v+=b.qty*b.cost});
  var c=cat(name),b='<div class="card" style="margin-top:8px"><div class="kv"><span>Tổng số lượng</span><b>'+qs(name,t)+'</b></div><div class="kv"><span>Số đợt nhập</span><b>'+bs.length+'</b></div><div class="kv"><span>Trị giá theo giá nhập</span><b>'+money(v)+'</b></div></div>';
  if(c){
    b+='<div class="card"><h3>Bảo quản (AI gợi ý)</h3><div class="kv"><span>Nơi cất</span><b>'+LOC[c.l]+', '+TEMP[c.l]+'</b></div><div class="kv"><span>Hạn dùng thường gặp</span><b>~'+c.d+' ngày</b></div><span class="sub" style="font-size:13px;color:var(--ink)">'+esc(c.tip)+'</span>'+
      '<span class="sub">AI gợi ý từ tên mặt hàng. Bạn có thể đổi nơi cất và hạn dùng ở mục Chỉnh sửa.</span></div>';
  }
  if(bs.length>1)b+='<div class="note">Các lần nhập cùng một mặt hàng được gộp thành một thẻ. Mỗi đợt giữ riêng số lượng, hạn dùng và giá nhập. Khi dùng, kho trừ đợt hết hạn sớm trước.</div>';
  b+='<div class="list">'+bs.map(function(x){
    var d=daysLeft(x);
    return '<div class="row"><div class="row-top"><div class="grow"><span class="nm">Đợt nhập '+dmy(x.imp)+'</span><span class="sub">'+qs(name,x.qty)+' · giá nhập '+money(x.cost)+'/'+esc(U(name))+' · trị giá '+money(x.qty*x.cost)+'<br>Hạn dùng '+dmy(x.exp)+' · '+LOC[x.loc]+'</span></div><span class="tag '+tone(d)+'">'+dlabel(d)+'</span></div>'+
      '<div class="row-act">'+(d>=0?'<button class="mini p" data-act="proc" data-id="'+x.id+'">Xử lí</button>':'')+'<button class="mini" data-act="waste" data-id="'+x.id+'">Bỏ đi</button></div></div>';
  }).join('')+'</div>';
  return wrap('t-det',esc(cap(name)),b);
}

/* --- Xử lí đợt hàng --- */
function procA(b){
  var u=U(b.name);
  var h='<label class="lab" for="pr-qty">Số lượng xử lí ('+esc(u)+')</label><input class="inp" id="pr-qty" type="number" min="0" max="'+b.qty+'" step="'+stepOf(u)+'" value="'+proc.qty+'">';
  if(proc.opt==='sell')h+='<label class="lab" for="pr-price">Giá thu mua (đ mỗi '+esc(u)+')</label><input class="inp" id="pr-price" type="number" min="0" step="500" value="'+proc.price+'">';
  return h;
}
function procDyn(b){
  var qty=proc.qty,val=qty*b.cost,u=U(b.name);
  if(proc.opt==='donate')return '<div class="card"><span class="sub" style="font-size:13px;color:var(--ink)">Quyên góp '+qs(b.name,qty)+' cho nhóm thiện nguyện. Giá trị hàng '+money(val)+', ghi vào mục Đã xử lí, không tính là hao hụt.</span></div>';
  if(proc.opt==='sell'){var rev=qty*proc.price;return '<div class="card"><div class="kv"><span>Thu về</span><b>'+money(rev)+'</b></div><div class="kv"><span>Thu hồi so với giá nhập</span><b>'+(val>0?Math.round(rev/val*100):0)+'%</b></div></div>'}
  if(proc.opt==='waste')return '<div class="card"><div class="kv"><span>Hao hụt</span><b style="color:var(--bad-fg)">'+money(val)+'</b></div></div>';
  var ds=S.dishes.filter(function(x){return x.i.some(function(i){return i[0]===b.name})});
  var h='<div class="h3" style="margin-top:14px">AI gợi ý món dùng '+esc(b.name)+'</div>';
  if(!ds.length)h+='<div class="note">Chưa có món nào dùng nguyên liệu này. Bạn có thể thêm món mới bên dưới.</div>';
  else h+='<div class="list">'+ds.map(function(x){
    var n=portionsWith(x,b,qty),pf=(x.price-dishCost(x))*n,sel=proc.did===x.id;
    return '<div class="row" style="'+(sel?'border:2px solid var(--accent-text);':'border:2px solid transparent;')+'"><div class="row-top"><button class="prow" style="padding:0;background:none" data-act="procDish" data-did="'+x.id+'" aria-pressed="'+sel+'"><div class="grow"><span class="nm">'+esc(x.n)+'</span><span class="sub">'+(n>0?'Làm được '+n+' phần · lãi gộp dự kiến '+money(pf):'Thiếu: '+dishMissing(x).map(cap).join(', '))+'</span></div></button>'+
      '<button class="mini" data-act="procDelDish" data-did="'+x.id+'" aria-label="Bỏ món '+esc(x.n)+' khỏi thực đơn">Bỏ món</button></div></div>';
  }).join('')+'</div>';
  if(proc.nf){
    h+='<div class="card"><h3>Thêm món mới vào thực đơn</h3><label class="fl">Tên món<input class="inp" id="nf-n" value="'+esc(proc.nf.n)+'" maxlength="40" placeholder="Ví dụ: Gà kho gừng"></label>'+
      '<div class="f2"><label class="fl">Giá bán (đ)<input class="inp" id="nf-p" type="number" min="0" step="1000" value="'+esc(proc.nf.p)+'"></label><label class="fl">'+esc(cap(b.name))+' mỗi phần ('+esc(u)+')<input class="inp" id="nf-q" type="number" min="0" step="any" value="'+esc(proc.nf.q)+'"></label></div>'+
      '<span class="sub">Nguyên liệu khác của món có thể bổ sung sau ở Thực đơn, mục Chi tiết.</span>'+
      '<div class="btns"><button class="btn primary" data-act="nfSave">Tạo món</button><button class="btn outline" data-act="nfCancel">Hủy</button></div></div>';
  }else h+='<button class="btn outline full" style="margin-top:8px" data-act="nfOpen">'+ic('plus',18)+'Thêm món mới</button>';
  return h;
}
function procB(b){
  if(proc.opt!=='waste')return '';
  var h='<div class="lab">Lí do bỏ</div><div class="chips" style="margin-top:0;flex-wrap:wrap">'+REASONS.map(function(r){return '<button class="chip'+(proc.reason===r?' on':'')+'" data-act="procReason" data-r="'+r+'">'+r+'</button>'}).join('')+'</div>';
  if(proc.reason==='Khác')h+='<label class="lab" for="pr-note">Ghi lí do (bắt buộc)</label><input class="inp" id="pr-note" maxlength="80" value="'+esc(proc.note)+'" placeholder="Ví dụ: Rơi vỡ khi vận chuyển">';
  return h+'<div class="note">AI sẽ sử dụng lí do này để phân tích và gợi ý mức nhập lần tới.</div>';
}
function procFoot(b){
  var qty=proc.qty,d={label:'',dis:!(qty>0)};
  if(proc.opt==='donate')d.label='Xác nhận quyên góp';
  else if(proc.opt==='sell')d.label='Xác nhận bán thu mua';
  else if(proc.opt==='cook'){
    var ds=proc.did!=null?dishById(proc.did):null,n=ds?portionsWith(ds,b,qty):0;
    d.label=n>0?'Nấu '+n+' phần '+ds.n:'Chọn món làm được';
    if(n<1)d.dis=true;
  }else{
    d.label='Xác nhận bỏ đi';
    if(proc.reason==='Khác'&&!String(proc.note||'').trim())d.dis=true;
  }
  return d;
}
function updProcDyn(){
  var b=findB(proc.id);if(!b)return;
  var d=el('pr-dyn');if(d)d.innerHTML=procDyn(b);
  updProcFoot();
}
function updProcFoot(){
  var b=findB(proc.id);if(!b)return;
  var f=procFoot(b),g=el('pr-go');if(g){g.textContent=f.label;g.disabled=f.dis}
}
function vProc(){
  var b=findB(proc.id);if(!b)return '';
  var d=daysLeft(b),can=d>=0;
  var opts=can?[['donate','Quyên góp'],['sell','Bán thu mua'],['cook','Nấu món mới'],['waste','Bỏ đi']]:[['waste','Bỏ đi']];
  var h='<div class="card" style="margin-top:8px"><div class="row-top"><div class="grow"><span class="nm">'+esc(cap(b.name))+' · đợt nhập '+dmy(b.imp)+'</span><span class="sub">Còn '+qs(b.name,b.qty)+' · giá nhập '+money(b.cost)+'/'+esc(U(b.name))+'</span></div><span class="tag '+tone(d)+'">'+dlabel(d)+'</span></div></div>';
  if(!can)h+='<div class="note">Đợt này đã hết hạn nên chỉ có thể bỏ đi. Nút Xử lí chỉ dành cho đồ còn dùng được.</div>';
  h+='<div class="optgrid" role="group" aria-label="Cách xử lí">'+opts.map(function(o){return '<button class="opt'+(proc.opt===o[0]?' on':'')+'" data-act="procOpt" data-o="'+o[0]+'" aria-pressed="'+(proc.opt===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>';
  h+='<div id="pr-a">'+procA(b)+'</div><div id="pr-dyn">'+procDyn(b)+'</div><div id="pr-b">'+procB(b)+'</div>';
  var f=procFoot(b);
  h+='<div style="margin-top:12px"><button class="btn primary full" id="pr-go" data-act="procGo"'+(f.dis?' disabled':'')+'>'+f.label+'</button></div>';
  return wrap('t-proc',can?'Xử lí đợt hàng':'Bỏ đợt hàng',h,true);
}

/* --- Chi tiết món (định lượng) --- */
function deCost(){
  var c=0;de.ings.forEach(function(x){if(x.n&&num0(x.q)>0)c+=num0(x.q)*avgCost(x.n)});
  return c;
}
function deSum(){
  var c=deCost(),p=num0(de.price),pf=p-c;
  return '<div class="kv"><span>Giá vốn mỗi phần</span><b>'+money(c)+'</b></div><div class="kv"><span>Lãi gộp mỗi phần</span><b style="color:'+(pf>=0?'var(--ok-fg)':'var(--bad-fg)')+'">'+money(pf)+' ('+(p>0?Math.round(pf/p*100):0)+'%)</b></div>';
}
function deIngsHtml(){
  if(!de.ings.length)return '<div class="note">Chưa có nguyên liệu. Bấm Thêm nguyên liệu để nhập định lượng.</div>';
  return de.ings.map(function(x,i){
    return '<div class="row-top" style="margin-top:8px;align-items:flex-end"><label class="fl grow">Nguyên liệu<input class="inp" list="dl" value="'+esc(x.n)+'" data-de="in" data-ri="'+i+'" maxlength="40"></label>'+
      '<label class="fl" style="width:96px">Định lượng<input class="inp" type="number" min="0" step="any" value="'+esc(x.q)+'" data-de="iq" data-ri="'+i+'"></label>'+
      '<span class="sub" style="width:34px;padding-bottom:12px" id="du'+i+'">'+esc(x.n?U(x.n):'')+'</span><button class="ibtn" data-act="deDel" data-ri="'+i+'" aria-label="Xóa nguyên liệu '+(i+1)+'">'+ic('trash',20)+'</button></div>';
  }).join('');
}
function vDish(){
  var h='<label class="lab" for="de-name">Tên món</label><input class="inp" id="de-name" data-de="name" maxlength="40" value="'+esc(de.name)+'">'+
    '<label class="lab" for="de-price">Giá bán (đ mỗi phần)</label><input class="inp" id="de-price" type="number" min="0" step="1000" data-de="price" value="'+esc(de.price)+'">'+
    '<div class="h3">Định lượng nguyên liệu cho 1 phần</div><div id="de-ings">'+deIngsHtml()+'</div>'+
    '<button class="btn outline full" style="margin-top:10px" data-act="deAdd">'+ic('plus',18)+'Thêm nguyên liệu</button>'+
    '<div class="card" id="de-sum">'+deSum()+'</div>'+
    '<div class="note">Giá vốn tính theo giá nhập thực tế của các đợt còn dùng được. Nguyên liệu chưa từng nhập sẽ có giá vốn 0 cho đến khi nhập kho.</div>'+
    '<div class="btns" style="margin-top:12px"><button class="btn primary" data-act="deSave">Lưu món</button>'+(de.id!=null?'<button class="btn outline" data-act="deRemove">Xóa món</button>':'')+'</div>';
  return wrap('t-dish',de.id!=null?'Chi tiết món':'Thêm món mới',h);
}

/* --- Chỉnh sửa kho --- */
function edWork(b){return edB[b.id]||{q:b.qty,u:U(b.name),c:b.cost,imp:b.imp,exp:b.exp,loc:b.loc}}
function edChanged(b){
  var w=edB[b.id];if(!w)return false;
  return num0(w.q)!==b.qty||String(w.u).trim()!==U(b.name)||num0(w.c)!==b.cost||w.imp!==b.imp||w.exp!==b.exp||w.loc!==b.loc;
}
function edList(){
  var q=norm(edQ.trim());
  var list=S.batches.filter(function(b){return !q||norm(b.name).indexOf(q)>-1}).slice();
  if(edSort==='exp')list.sort(function(a,b){return a.exp<b.exp?-1:(a.exp>b.exp?1:0)});
  else if(edSort==='imp')list.sort(function(a,b){return a.imp<b.imp?1:(a.imp>b.imp?-1:0)});
  else list.sort(function(a,b){return a.name.localeCompare(b.name,'vi')||(a.exp<b.exp?-1:1)});
  if(!list.length)return '<div class="empty">Không tìm thấy món nào.</div>';
  return list.map(function(b){
    var w=edWork(b),open=!!edB[b.id]&&edB[b.id]._open,d=daysLeft({exp:w.exp});
    var h='<div class="card" id="eb'+b.id+'"><div class="row-top"><div class="grow"><span class="nm">'+esc(cap(b.name))+' · Đợt nhập '+dmy(w.imp)+'</span><span class="sub">'+fmt(num0(w.q))+' '+esc(w.u)+' · giá nhập '+money(num0(w.c))+' · hạn dùng '+dmy(w.exp)+'</span></div><span class="tag '+tone(d)+'">'+dlabel(d)+'</span></div>';
    if(open){
      h+='<div class="f2"><label class="fl">Số lượng<input class="inp" type="number" min="0" step="any" value="'+esc(w.q)+'" data-eb="q" data-id="'+b.id+'"></label>'+
        '<label class="fl">Đơn vị<input class="inp" list="ul" value="'+esc(w.u)+'" data-eb="u" data-id="'+b.id+'" maxlength="12"></label>'+
        '<label class="fl">Giá nhập (đ)<input class="inp" type="number" min="0" step="any" value="'+esc(w.c)+'" data-eb="c" data-id="'+b.id+'"></label>'+
        '<label class="fl">Nơi cất<select class="inp" data-eb="loc" data-id="'+b.id+'">'+Object.keys(LOC).map(function(k){return '<option value="'+k+'"'+(w.loc===k?' selected':'')+'>'+LOC[k]+'</option>'}).join('')+'</select></label>'+
        '<label class="fl">Ngày nhập<input class="inp" type="date" max="'+plus(0)+'" value="'+esc(w.imp)+'" data-eb="imp" data-id="'+b.id+'"></label>'+
        '<label class="fl">Hạn dùng<input class="inp" type="date" min="'+esc(w.imp)+'" value="'+esc(w.exp)+'" data-eb="exp" data-id="'+b.id+'"></label></div>'+
        '<span class="sub">Đơn vị áp dụng cho cả mặt hàng và không tự quy đổi số lượng. Sửa giảm số lượng hoặc giá nhập sẽ ghi vào chênh lệch kiểm kho.</span>';
    }
    h+='<div class="row-act">'+(edChanged(b)?'<span class="tag warn">Đã sửa</span>':'')+'<button class="mini" data-act="edToggle" data-id="'+b.id+'">'+(open?'Thu gọn':'Sửa đợt này')+'</button></div></div>';
    return h;
  }).join('');
}
function vEdit(){
  var b='<div class="seg"><button class="'+(edTab==='qty'?'on':'')+'" data-act="edTab" data-t="qty">Sửa đợt hàng</button><button class="'+(edTab==='new'?'on':'')+'" data-act="edTab" data-t="new">Nhập tay đợt mới</button></div>';
  if(edTab==='qty'){
    b+='<input class="inp" id="ed-q" type="search" style="margin-top:12px" placeholder="Tìm món cần sửa" aria-label="Tìm món cần sửa" value="'+esc(edQ)+'" autocomplete="off">';
    b+='<select class="inp" id="ed-sort" data-act="edSort" style="margin-top:8px" aria-label="Sắp xếp danh sách sửa"><option value="exp"'+(edSort==='exp'?' selected':'')+'>Theo hạn dùng gần nhất</option><option value="imp"'+(edSort==='imp'?' selected':'')+'>Theo ngày nhập mới nhất</option><option value="name"'+(edSort==='name'?' selected':'')+'>Theo tên A–Z</option></select>';
    b+='<div class="note">Mỗi đợt nhập là một thẻ riêng. Dùng khi kiểm kho thực tế thấy lệch với sổ sách, hoặc cần sửa ngày nhập, đơn vị, hạn dùng.</div>';
    b+='<div id="ed-list">'+edList()+'</div>';
    b+='<div style="margin-top:12px"><button class="btn primary full" data-act="edSave">Lưu thay đổi</button></div>';
  }else{
    b+='<label class="lab" for="f-name">Tên món</label><input class="inp" id="f-name" list="dl" placeholder="Ví dụ: cà chua" maxlength="40" autocomplete="off">'+
      '<div class="f2"><label class="fl">Số lượng<input class="inp" id="f-qty" type="number" min="0" step="any" placeholder="Ví dụ: 2"></label>'+
      '<label class="fl">Đơn vị<input class="inp" id="f-unit" list="ul" maxlength="12" placeholder="kg, quả, hộp…"></label>'+
      '<label class="fl">Giá nhập (đ mỗi đơn vị)<input class="inp" id="f-cost" type="number" min="0" step="any" placeholder="Ví dụ: 35000"></label>'+
      '<label class="fl">Nơi cất<select class="inp" id="f-loc"><option value="fridge">Tủ lạnh</option><option value="pantry">Tủ bếp</option><option value="freezer">Ngăn đông</option></select></label>'+
      '<label class="fl">Ngày nhập<input class="inp" id="f-imp" type="date" max="'+plus(0)+'" value="'+plus(0)+'"></label>'+
      '<label class="fl">Hạn dùng<input class="inp" id="f-exp" type="date" min="'+plus(0)+'" value="'+plus(7)+'"></label></div>'+
      '<div class="note" id="f-hint">Gõ tên món để AI gợi ý hạn dùng, nơi cất và giá nhập. Hạn dùng chỉ chọn được từ hôm nay trở đi. Nếu món đã có trong kho, đợt mới sẽ gộp vào cùng thẻ.</div>'+
      '<div style="margin-top:12px"><button class="btn primary full" data-act="newSave">Thêm đợt nhập</button></div>';
  }
  return wrap('t-ed','Chỉnh sửa kho',b);
}
function vOv(){
  if(!ov)return '';
  if(ov.t==='scan')return vScan();
  if(ov.t==='bell')return vBell();
  if(ov.t==='detail')return vDetail();
  if(ov.t==='proc')return vProc();
  if(ov.t==='edit')return vEdit();
  if(ov.t==='dish')return vDish();
  return '';
}

/* ===== Vẽ giao diện ===== */
function render(){
  var m=el('main'),top=m.scrollTop;
  m.innerHTML={kho:vKho,mon:vMon,ai:vAI,tk:vTK}[view]();
  m.scrollTop=top;
  var un=unreadCount();
  el('top').innerHTML='<div class="brand"><i>'+ic('leaf',16)+'</i>Trợ lý kho bếp</div><div class="tbs">'+
    '<button class="tb" data-act="openScan" aria-label="Quét chứng từ nhập xuất">'+ic('scan',20)+'Quét</button>'+
    '<button class="tb" data-act="openBell" aria-label="Thông báo'+(un?', '+un+' chưa đọc':'')+'">'+ic('bell',20)+(un?'<span class="nbadge">'+un+'</span>':'')+'</button></div>';
  var tabs=[['kho','Kho','box'],['mon','Thực đơn','book'],['ai','Trợ lí AI','spark'],['tk','Thống kê','chart']];
  el('nav').innerHTML=tabs.map(function(t){
    return '<button class="'+(view===t[0]?'on':'')+'" data-act="tab" data-v="'+t[0]+'"'+(view===t[0]?' aria-current="page"':'')+'>'+ic(t[2],22)+t[1]+'</button>';
  }).join('');
  var names=Object.keys(P).concat(Object.keys(S.custom));
  el('dls').innerHTML='<datalist id="dl">'+names.map(function(k){return '<option value="'+esc(k)+'">'}).join('')+'</datalist><datalist id="ul">'+UNITS.map(function(k){return '<option value="'+k+'">'}).join('')+'</datalist>';
  renderOv();
}
function renderOv(){
  var host=el('ov'),s=host.querySelector('.sheet'),top=s?s.scrollTop:0;
  host.innerHTML=vOv();
  var s2=host.querySelector('.sheet');if(s2)s2.scrollTop=top;
}

/* ===== Hành động ===== */
function openProc(id,opt){
  var b=findB(id);if(!b)return;
  var d=daysLeft(b),sg=suggest(b);
  proc={id:id,opt:d>=0?(opt||'donate'):'waste',qty:b.qty,price:Math.round(b.cost*0.5/100)*100,did:sg.ds?sg.ds.id:null,reason:d<0?'Hết hạn':'Hỏng/ôi thiu',note:'',nf:null,from:ov?ov.t:null,name:b.name};
  ov={t:'proc'};renderOv();
}
function afterProc(name){

function sampleRows(){
  if(scan.tab==='in')return RECEIPT_IN.map(function(r){return {n:r.n,q:r.q,c:r.c,u:U(r.n),on:!abnormal(r.n,r.q)}});
  return REPORT_OUT.filter(function(r){return r.k!=='dish'||dishByName(r.dn)}).map(function(r){var o={};for(var k in r)o[k]=r[k];o.on=true;return o});
}
function parseCsv(text,tab){
  var rows=[];
  String(text).split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var f=line.split(/[;,\t]/).map(function(x){return x.trim()});
    if(f.length<2)return;
    var name=f[0].toLowerCase(),q=num(f[1]);
    if(isNaN(q)||q<=0||!name)return;
    if(tab==='in'){
      var u='',c=NaN;
      if(f[2]!==undefined&&f[2]!==''){if(!isNaN(num(f[2]))&&f[3]===undefined)c=num(f[2]);else u=f[2]}
      if(f[3]!==undefined&&f[3]!=='')c=num(f[3]);
      var cc=cat(name);
      if(isNaN(c))c=cc?cc.c:0;
      rows.push({n:name,q:q,c:c,u:u||U(name),on:!abnormal(name,q)});
    }else{
      var ds=dishByName(name);
      if(ds)rows.push({k:'dish',dn:ds.n,p:q,on:true});else rows.push({k:'ing',n:name,q:q,on:true});
    }
  });
  return rows;
}
function handleFile(file){
  scan.file=file.name;scan.phase='reading';renderOv();
  var low=file.name.toLowerCase();
  if(/\.(csv|txt)$/.test(low)&&typeof FileReader!=='undefined'){
    var fr=new FileReader();
    fr.onload=function(){
      var rows=parseCsv(fr.result,scan.tab);
      if(!ov||ov.t!=='scan')return;
      if(!rows.length){scan.phase='idle';scan.file='';renderOv();toast('Không đọc được dòng nào. Mỗi dòng cần có tên món và số lượng.');return}
      startScan(rows);
    };
    fr.onerror=function(){scan.phase='idle';renderOv();toast('Không mở được file này.')};
    fr.readAsText(file);
  }else{
    setTimeout(function(){if(!ov||ov.t!=='scan')return;startScan(sampleRows());toast('Bản demo chưa đọc nội dung '+file.name+', đang dùng dữ liệu mẫu.')},1400);
  }
}
function doOutCommit(){
  var lines=0,rev=0,nd=outNeeds();
  scan.rows.forEach(function(r){
    if(!r.on)return;
    if(r.k==='dish'){
      var ds=dishByName(r.dn),p=num0(r.p);if(!ds||p<=0)return;
      var cost=0;ds.i.forEach(function(x){cost+=deduct(x[0],x[1]*p).cost});
      addLog({type:'sale',dish:ds.n,portions:p,revenue:p*ds.price,cost:cost,src:'report'});rev+=p*ds.price;lines++;
    }else{
      var q=num0(r.q);if(!r.n||q<=0)return;
      var t2=deduct(r.n,q);addLog({type:'use',name:r.n,qty:q-t2.short,cost:t2.cost});lines++;
    }
  });
  nd.short.forEach(function(x){addEv('Thiếu hụt khi trừ kho: '+x.n+'|Báo cáo dùng '+qs(x.n,x.need)+' nhưng kho chỉ có '+qs(x.n,x.av)+'. Hãy kiểm tra hóa đơn nhập hoặc kiểm kho lại.','warn')});
  addEv('Đã trừ kho theo báo cáo ngày '+dmy(plus(0))+'|'+lines+' dòng, doanh thu '+money(rev)+'.');
  return lines;
}
function doInCommit(){
  var n=0,abn=[],skip=[];
  scan.rows.forEach(function(r){
    var name=String(r.n||'').trim().toLowerCase(),q=num0(r.q),c=num0(r.c),u=String(r.u||'').trim();
    if(!r.on||!name||q<=0)return;
    ensureProduct(name,u||'kg','fridge',c);
    if(u&&u!==U(name))S.units[name]=u;
    var cc=cat(name);
    addBatch(name,q,c,plus(cc.d||7),cc.l||'fridge','Hóa đơn');n++;
    if(abnormal(name,q))abn.push({n:name,q:q});
  });
  scan.rows.forEach(function(r){if(!r.on&&abnormal(r.n,r.q))addEv('Nhập '+r.n+' bất thường chưa thêm|Hóa đơn ghi '+qs(r.n,r.q)+', cao hơn mức thường nhập. Bạn đã không thêm dòng này vào kho.','warn')});
  abn.forEach(function(r){addEv('Đã xác nhận nhập '+r.n+' số lượng lớn|Bạn giữ nguyên '+qs(r.n,r.q)+' dù cao bất thường. AI sẽ theo dõi hao hụt của mặt hàng này.','warn')});
  return n;
}

  if(ds.de!==undefined&&de){
    if(ds.de==='name')de.name=t.value;
    else if(ds.de==='price'){de.price=t.value;var s1=el('de-sum');if(s1)s1.innerHTML=deSum()}
    else{
      var x=de.ings[+ds.ri];if(!x)return;
      if(ds.de==='in'){x.n=t.value.trim().toLowerCase();var un=el('du'+ds.ri);if(un)un.textContent=x.n?U(x.n):''}
      else x.q=t.value;
      var s2=el('de-sum');if(s2)s2.innerHTML=deSum();
    }
    return;
  }
  if(ds.eb!==undefined){
    var w=edB[ds.id];if(!w)return;
    w[ds.eb]=t.value;
    if(ds.eb==='imp'){var ex=t.closest('.card').querySelector('[data-eb="exp"]');if(ex)ex.min=t.value}
    return;
  }
  if(t.id==='f-name'){
    var k=t.value.trim().toLowerCase(),x2=cat(k),h=el('f-hint');
    if(x2){
      el('f-exp').value=plus(x2.d);el('f-loc').value=x2.l;el('f-unit').value=U(k);el('f-cost').value=x2.c;
      var exs=S.batches.some(function(b){return b.name===k});
      h.textContent='AI gợi ý: '+cap(k)+' để được khoảng '+x2.d+' ngày, cất ở '+LOC[x2.l].toLowerCase()+' ('+TEMP[x2.l]+'), giá nhập tham khảo '+money(x2.c)+'/'+U(k)+'.'+(exs?' Món này đã có trong kho, đợt mới sẽ gộp vào cùng thẻ.':'');
    }else h.textContent='Chưa có gợi ý cho món này. Hãy tự nhập đơn vị, hạn dùng và giá nhập.';
  }
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  if(t.tagName==='INPUT'||t.tagName==='SELECT')return;
  var d=Object.assign({},t.dataset);
  if(t.dataset.act==='closeBg'){if(e.target!==t)return;d._target=t}
  act(t.dataset.act,d,t);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sc-file'||t.id==='sc-cam'){var f=t.files&&t.files[0];t.value='';if(f)handleFile(f);return}
  if(t.dataset&&t.dataset.act&&(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='number'||t.type==='date'))act(t.dataset.act,Object.assign({},t.dataset),t);
  else if(t.tagName==='SELECT')silent(e);
});
document.addEventListener('input',silent);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ov){ov=null;proc=null;de=null;edB={};render()}
  if(e.key==='Enter'&&e.target.id==='q-in')act('send',{},e.target);
});

S=load();render();
/*TEST_HOOK*/
})();
</script>
</body>
</html>
